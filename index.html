<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XAUUSD Trade History — 29-30 Jan 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap');

  :root {
    --bg:       #0a0b0e;
    --surface:  #111318;
    --border:   #1e2028;
    --text:     #e8eaf0;
    --muted:    #555b6e;
    --buy:      #3b9eff;
    --sell:     #ff5f57;
    --win:      #00d084;
    --loss:     #ff4444;
    --sl:       #ff6b35;
    --gold:     #f5c842;
    --accent:   #7c6fff;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    gap: 16px;
    flex-wrap: wrap;
  }

  .header-title {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .header-title h1 {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: var(--gold);
  }

  .header-title span {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  .stats {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }

  .stat-label {
    font-size: 9px;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .stat-value {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    font-weight: 700;
  }

  .stat-value.pos { color: var(--win); }
  .stat-value.neg { color: var(--loss); }
  .stat-value.gold { color: var(--gold); }
  .stat-value.blue { color: var(--buy); }

  /* ── CONTROLS ── */
  .controls {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    flex-wrap: wrap;
  }

  .ctrl-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-right: 4px;
  }

  .btn {
    background: var(--border);
    border: 1px solid #2a2d38;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn:hover { background: #2a2d38; border-color: var(--muted); }
  .btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .separator { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }

  .toggle-wrap { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .toggle-wrap input[type=checkbox] { accent-color: var(--accent); width: 13px; height: 13px; cursor: pointer; }
  .toggle-wrap label { font-size: 10px; color: var(--muted); cursor: pointer; letter-spacing: 0.06em; }

  /* ── MAIN CANVAS AREA ── */
  .chart-area {
    flex: 1;
    display: flex;
    overflow: hidden;
    position: relative;
  }

  #mainCanvas {
    display: block;
    cursor: crosshair;
  }

  /* ── TOOLTIP ── */
  #tooltip {
    position: fixed;
    background: #1a1d26;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    line-height: 1.7;
    pointer-events: none;
    display: none;
    z-index: 999;
    min-width: 200px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }

  #tooltip .tt-header {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 12px;
    margin-bottom: 6px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  #tooltip .tt-buy  { color: var(--buy); }
  #tooltip .tt-sell { color: var(--sell); }
  #tooltip .tt-win  { color: var(--win); }
  #tooltip .tt-loss { color: var(--loss); }
  #tooltip .tt-muted { color: var(--muted); }

  /* ── PNL MINI CHART ── */
  #pnlCanvas {
    display: block;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    cursor: crosshair;
  }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { height: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .zoom-hint {
    position: absolute;
    bottom: 8px;
    left: 12px;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.06em;
    pointer-events: none;
  }
</style>
</head>

// ── STATE ──
let filter = 'all';
let viewStart = 0;   // index into sorted trade events
let zoom = 1.0;
let panOffset = 0;   // pixels
let isDragging = false;
let dragStartX = 0;
let dragStartPan = 0;

const PAD = { top: 40, right: 80, bottom: 20, left: 10 };
const PRICE_W = 72;

// Parse datetime string to ms timestamp
function parseDT(s) {
  const [date, time] = s.split(' ');
  const [y,m,d] = date.split('-');
  const [hh,mm] = time.split(':');
  return new Date(+y, +m-1, +d, +hh, +mm, 0).getTime();
}

// Pre-compute timestamps
TRADES.forEach(t => {
  t.openMs  = parseDT(t.openTime);
  t.closeMs = parseDT(t.closeTime);
});

// Time range
const tMin = Math.min(...TRADES.map(t => t.openMs));
const tMax = Math.max(...TRADES.map(t => t.closeMs));
const tRange = tMax - tMin;

// Price range
const allPrices = TRADES.flatMap(t => [t.openPrice, t.closePrice, t.sl > 0 ? t.sl : t.openPrice]);
const pMin = Math.min(...allPrices) - 10;
const pMax = Math.max(...allPrices) + 10;

// Canvases
const mainCanvas = document.getElementById('mainCanvas');
const pnlCanvas  = document.getElementById('pnlCanvas');
const chartArea  = document.getElementById('chartArea');
const mc = mainCanvas.getContext('2d');
const pc = pnlCanvas.getContext('2d');
const tooltip = document.getElementById('tooltip');

function resize() {
  const aw = chartArea.clientWidth;
  const ah = chartArea.clientHeight;
  mainCanvas.width  = aw;
  mainCanvas.height = ah;

  const showPnL = document.getElementById('chkPnL').checked;
  pnlCanvas.width  = aw;
  pnlCanvas.height = showPnL ? 90 : 0;
  pnlCanvas.style.display = showPnL ? 'block' : 'none';

  redraw();
}

function togglePnL() {
  resize();
}

// Map time → x pixel
function timeToX(ms) {
  const w = mainCanvas.width - PAD.left - PRICE_W;
  const tSpan = tRange / zoom;
  const tStart = tMin + (tRange - tSpan) * (panOffset / Math.max(1, (mainCanvas.width * (zoom - 1))));
  return PAD.left + ((ms - tStart) / tSpan) * w;
}

// Map x pixel → time
function xToTime(x) {
  const w = mainCanvas.width - PAD.left - PRICE_W;
  const tSpan = tRange / zoom;
  const tStart = tMin + (tRange - tSpan) * (panOffset / Math.max(1, (mainCanvas.width * (zoom - 1))));
  return tStart + ((x - PAD.left) / w) * tSpan;
}

// Map price → y pixel
function priceToY(p) {
  const h = mainCanvas.height - PAD.top - PAD.bottom;
  return PAD.top + (1 - (p - pMin) / (pMax - pMin)) * h;
}

function getVisibleTrades() {
  if (filter === 'all') return TRADES;
  if (filter === 'wins') return TRADES.filter(t => t.net > 0);
  if (filter === 'losses') return TRADES.filter(t => t.net <= 0);
  if (filter === 'buy') return TRADES.filter(t => t.type === 'BUY');
  if (filter === 'sell') return TRADES.filter(t => t.type === 'SELL');
  return TRADES;
}

function setFilter(f, btn) {
  filter = f;
  document.querySelectorAll('.btn[id^=btn]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  redraw();
}

function formatTime(ms) {
  const d = new Date(ms);
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function formatPrice(p) {
  return p.toFixed(2);
}

// ── MAIN DRAW ──
function redraw() {
  const W = mainCanvas.width;
  const H = mainCanvas.height;
  mc.clearRect(0, 0, W, H);

  // Background
  mc.fillStyle = '#0a0b0e';
  mc.fillRect(0, 0, W, H);

  drawGrid();
  drawTrades();
  drawPriceAxis();
  drawTimeAxis();
  drawPnLChart();
}

function drawGrid() {
  const W = mainCanvas.width;
  const H = mainCanvas.height;

  // Horizontal price grid
  const steps = 10;
  mc.strokeStyle = '#1a1d24';
  mc.lineWidth = 1;
  for (let i = 0; i <= steps; i++) {
    const p = pMin + (pMax - pMin) * i / steps;
    const y = priceToY(p);
    mc.beginPath();
    mc.moveTo(PAD.left, y);
    mc.lineTo(W - PRICE_W, y);
    mc.stroke();
  }
}

function drawPriceAxis() {
  const W = mainCanvas.width;
  const H = mainCanvas.height;
  const steps = 10;

  mc.fillStyle = '#111318';
  mc.fillRect(W - PRICE_W, 0, PRICE_W, H);

  mc.strokeStyle = '#1e2028';
  mc.lineWidth = 1;
  mc.beginPath();
  mc.moveTo(W - PRICE_W, PAD.top);
  mc.lineTo(W - PRICE_W, H - PAD.bottom);
  mc.stroke();

  mc.fillStyle = '#555b6e';
  mc.font = '10px Space Mono, monospace';
  mc.textAlign = 'right';
  for (let i = 0; i <= steps; i++) {
    const p = pMin + (pMax - pMin) * i / steps;
    const y = priceToY(p);
    if (y < PAD.top || y > H - PAD.bottom) continue;
    mc.fillText(p.toFixed(1), W - 6, y + 3);
  }
}

function drawTimeAxis() {
  const W = mainCanvas.width;
  const H = mainCanvas.height;

  // Draw time labels — pick ~8 labels
  const numLabels = 8;
  mc.fillStyle = '#555b6e';
  mc.font = '9px Space Mono, monospace';
  mc.textAlign = 'center';

  for (let i = 0; i <= numLabels; i++) {
    const ms = tMin + (tRange * i / numLabels);
    const x = timeToX(ms);
    if (x < PAD.left + 20 || x > W - PRICE_W - 20) continue;
    mc.fillText(formatTime(ms), x, H - 4);

    mc.strokeStyle = '#1a1d24';
    mc.lineWidth = 1;
    mc.beginPath();
    mc.moveTo(x, PAD.top);
    mc.lineTo(x, H - PAD.bottom);
    mc.stroke();
  }
}

function drawTrades() {
  const trades = getVisibleTrades();

  // Draw SL lines first (behind)
  if (document.getElementById('chkSL').checked) {
    mc.lineWidth = 1;
    mc.setLineDash([3, 4]);
    trades.forEach(t => {
      if (t.sl <= 0) return;
      const x1 = timeToX(t.openMs);
      const x2 = timeToX(t.closeMs);
      const y  = priceToY(t.sl);
      if (x2 < PAD.left || x1 > mainCanvas.width - PRICE_W) return;
      mc.strokeStyle = 'rgba(255,107,53,0.45)';
      mc.beginPath();
      mc.moveTo(Math.max(PAD.left, x1), y);
      mc.lineTo(Math.min(mainCanvas.width - PRICE_W, x2), y);
      mc.stroke();
    });
    mc.setLineDash([]);
  }

  // Draw trade lines
  if (document.getElementById('chkLines').checked) {
    mc.lineWidth = 1.2;
    trades.forEach(t => {
      const x1 = timeToX(t.openMs);
      const x2 = timeToX(t.closeMs);
      const y1 = priceToY(t.openPrice);
      const y2 = priceToY(t.closePrice);
      if (x2 < PAD.left || x1 > mainCanvas.width - PRICE_W) return;
      mc.strokeStyle = t.net >= 0 ? 'rgba(0,208,132,0.35)' : 'rgba(255,68,68,0.25)';
      mc.beginPath();
      mc.moveTo(x1, y1);
      mc.lineTo(x2, y2);
      mc.stroke();
    });
  }

  // Draw arrows and dots
  trades.forEach(t => {
    const x1 = timeToX(t.openMs);
    const x2 = timeToX(t.closeMs);
    const y1 = priceToY(t.openPrice);
    const y2 = priceToY(t.closePrice);
    const W  = mainCanvas.width;

    const isBuy = t.type === 'BUY';
    const isWin = t.net >= 0;

    // Entry arrow
    if (x1 >= PAD.left && x1 <= W - PRICE_W) {
      drawArrow(mc, x1, y1, isBuy, isBuy ? '#3b9eff' : '#ff5f57');
    }

    // Exit dot
    if (x2 >= PAD.left && x2 <= W - PRICE_W) {
      mc.beginPath();
      mc.arc(x2, y2, 3.5, 0, Math.PI * 2);
      mc.fillStyle = isWin ? '#00d084' : '#ff4444';
      mc.fill();
    }
  });
}

function drawArrow(ctx, x, y, isUp, color) {
  const size = 7;
  ctx.fillStyle = color;
  ctx.beginPath();
  if (isUp) {
    ctx.moveTo(x, y - size);
    ctx.lineTo(x + size * 0.65, y + size * 0.4);
    ctx.lineTo(x - size * 0.65, y + size * 0.4);
  } else {
    ctx.moveTo(x, y + size);
    ctx.lineTo(x + size * 0.65, y - size * 0.4);
    ctx.lineTo(x - size * 0.65, y - size * 0.4);
  }
  ctx.closePath();
  ctx.fill();
}

function drawPnLChart() {
  if (!document.getElementById('chkPnL').checked) return;

  const W = pnlCanvas.width;
  const H = pnlCanvas.height;
  pc.clearRect(0, 0, W, H);

  pc.fillStyle = '#0d0f14';
  pc.fillRect(0, 0, W, H);

  // Zero line
  const cumVals = TRADES.map(t => t.cumNet);
  const pnlMin = Math.min(0, ...cumVals);
  const pnlMax = Math.max(0, ...cumVals);
  const pnlRange = pnlMax - pnlMin || 1;

  const pad = 8;
  function pnlY(v) {
    return pad + (1 - (v - pnlMin) / pnlRange) * (H - pad * 2);
  }

  // Zero line
  const zy = pnlY(0);
  pc.strokeStyle = '#2a2d38';
  pc.lineWidth = 1;
  pc.setLineDash([4, 4]);
  pc.beginPath(); pc.moveTo(PAD.left, zy); pc.lineTo(W - PRICE_W, zy); pc.stroke();
  pc.setLineDash([]);

  // Gradient fill under curve
  const grad = pc.createLinearGradient(0, pad, 0, H - pad);
  grad.addColorStop(0, 'rgba(0,208,132,0.25)');
  grad.addColorStop(1, 'rgba(0,208,132,0.02)');

  pc.beginPath();
  TRADES.forEach((t, i) => {
    const x = timeToX(t.closeMs);
    const y = pnlY(t.cumNet);
    if (i === 0) pc.moveTo(x, y); else pc.lineTo(x, y);
  });
  // Close to bottom for fill
  const lastX = timeToX(TRADES[TRADES.length-1].closeMs);
  pc.lineTo(lastX, H - pad);
  pc.lineTo(timeToX(TRADES[0].closeMs), H - pad);
  pc.closePath();
  pc.fillStyle = grad;
  pc.fill();

  // Line
  pc.strokeStyle = '#00d084';
  pc.lineWidth = 1.5;
  pc.beginPath();
  TRADES.forEach((t, i) => {
    const x = timeToX(t.closeMs);
    const y = pnlY(t.cumNet);
    if (i === 0) pc.moveTo(x, y); else pc.lineTo(x, y);
  });
  pc.stroke();

  // Labels
  pc.font = '9px Space Mono, monospace';
  pc.textAlign = 'right';
  pc.fillStyle = '#00d084';
  pc.fillText(`+$${pnlMax.toFixed(0)}`, W - 4, pad + 9);
  pc.fillStyle = '#555b6e';
  pc.fillText(`$${pnlMin.toFixed(0)}`, W - 4, H - 4);

  // P&L label
  pc.textAlign = 'left';
  pc.fillStyle = '#555b6e';
  pc.fillText('CUMULATIVE P&L', PAD.left + 4, 12);
}

// ── HIT TEST for tooltip ──
function findNearestTrade(mx, my) {
  const trades = getVisibleTrades();
  let best = null;
  let bestDist = 20; // px threshold

  trades.forEach(t => {
    const x1 = timeToX(t.openMs);
    const y1 = priceToY(t.openPrice);
    const dx = mx - x1, dy = my - y1;
    const d = Math.sqrt(dx*dx + dy*dy);
    if (d < bestDist) { bestDist = d; best = t; }

    const x2 = timeToX(t.closeMs);
    const y2 = priceToY(t.closePrice);
    const dx2 = mx - x2, dy2 = my - y2;
    const d2 = Math.sqrt(dx2*dx2 + dy2*dy2);
    if (d2 < bestDist) { bestDist = d2; best = t; }
  });

  return best;
}

function showTooltip(t, mx, my) {
  const isBuy = t.type === 'BUY';
  const isWin = t.net >= 0;
  const typeClass = isBuy ? 'tt-buy' : 'tt-sell';
  const pnlClass  = isWin ? 'tt-win' : 'tt-loss';
  const sign = isWin ? '+' : '';

  // Duration in minutes
  const durMin = Math.round((t.closeMs - t.openMs) / 60000);

  tooltip.innerHTML = `
    <div class="tt-header">
      <span class="${typeClass}">▲ ${t.type}</span>
      &nbsp;<span class="tt-muted">#${t.ticket}</span>
    </div>
    <span class="tt-muted">Open  </span>${t.openTime}<br>
    <span class="tt-muted">Sluit </span>${t.closeTime}
      <span class="tt-muted"> (${durMin}m)</span><br>
    <span class="tt-muted">Lots  </span>${t.lots}<br>
    <span class="tt-muted">Open  </span>${t.openPrice.toFixed(2)}<br>
    <span class="tt-muted">Sluit </span>${t.closePrice.toFixed(2)}<br>
    ${t.sl > 0 ? `<span class="tt-muted">SL    </span>${t.sl.toFixed(2)}<br>` : ''}
    <span class="tt-muted">Pips  </span><span class="${pnlClass}">${sign}${t.pips.toFixed(0)}</span><br>
    <span class="tt-muted">Net   </span><span class="${pnlClass}">${sign}$${t.net.toFixed(2)}</span>
  `;

  tooltip.style.display = 'block';
  let tx = mx + 16, ty = my - 10;
  if (tx + 220 > window.innerWidth) tx = mx - 230;
  if (ty + 200 > window.innerHeight) ty = my - 200;
  tooltip.style.left = tx + 'px';
  tooltip.style.top  = ty + 'px';
}

function hideTooltip() {
  tooltip.style.display = 'none';
}

// ── EVENTS ──
mainCanvas.addEventListener('mousemove', e => {
  const rect = mainCanvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  if (isDragging) {
    const dx = e.clientX - dragStartX;
    // Convert pixel delta to time delta
    const w = mainCanvas.width - PAD.left - PRICE_W;
    const tSpan = tRange / zoom;
    const timeDelta = (dx / w) * tSpan;
    const maxPan = mainCanvas.width * (zoom - 1);
    // Pan in time
    panOffset = Math.max(0, Math.min(maxPan, dragStartPan - dx));
    redraw();
    return;
  }

  const t = findNearestTrade(mx, my);
  if (t) {
    showTooltip(t, e.clientX, e.clientY);
    mainCanvas.style.cursor = 'pointer';
  } else {
    hideTooltip();
    mainCanvas.style.cursor = 'crosshair';
  }
});

mainCanvas.addEventListener('mousedown', e => {
  isDragging = true;
  dragStartX = e.clientX;
  dragStartPan = panOffset;
  mainCanvas.style.cursor = 'grabbing';
  hideTooltip();
});

window.addEventListener('mouseup', () => {
  isDragging = false;
  mainCanvas.style.cursor = 'crosshair';
});

mainCanvas.addEventListener('mouseleave', hideTooltip);

mainCanvas.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = mainCanvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;

  const zoomFactor = e.deltaY < 0 ? 1.15 : 1/1.15;
  const newZoom = Math.max(1, Math.min(200, zoom * zoomFactor));

  // Zoom toward mouse position
  const w = mainCanvas.width - PAD.left - PRICE_W;
  const ratio = (mx - PAD.left) / w;
  const tSpanOld = tRange / zoom;
  const tSpanNew = tRange / newZoom;

  zoom = newZoom;
  panOffset = Math.max(0, panOffset * (newZoom / (newZoom === 1 ? 1 : zoom)));
  redraw();
}, { passive: false });

document.getElementById('btnZoomIn').onclick  = () => { zoom = Math.min(200, zoom * 1.5); redraw(); };
document.getElementById('btnZoomOut').onclick = () => { zoom = Math.max(1, zoom / 1.5); panOffset = 0; redraw(); };
document.getElementById('btnReset').onclick   = () => { zoom = 1; panOffset = 0; redraw(); };

window.addEventListener('resize', resize);

// Init
resize();
</script>
</body>
